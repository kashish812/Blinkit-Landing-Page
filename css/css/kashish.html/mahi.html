<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    .main-container {
        height: 100vh;
        background-color: rgb(164, 204, 164);
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .card-container {
        position: relative;
        background-color: white;
        height: 75%;
        width: 25%;
        border-radius: 30px;
    }

    .img-container {
        height: 50%;
        display: flex;
        justify-content: center;
        background-color: lightgray;
        border-radius: 30px 30px 0 0;
    }

    .img-container img {
        height: 100%;
        width: 60%;
    }

    .img-desc {
        height: 35%;
        border-bottom: 1px solid lightgray;
        display: flex;
        flex-direction: column;
        justify-content: space-evenly;
        padding: 10px 20px 0 20px;
    }

    .img-desc * {
        /* outline: 1px solid red; */
    }

    .img-desc h1 {
        font-weight: 700;
        font-size: 28px;
    }

    .img-dec-btn-cont {
        display: flex;
        justify-content: space-between;
    }

    .img-dec-btn-cont button {
        width: 40%;
        height: 40px;
        border-radius: 5px;
        border: 1px solid lightgrey;
        background-color: transparent;


    }

    .price-container {
        height: 15%;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 20px 0 20px;
    }

    .price-container h1 span {
        font-size: 15px;
        font-weight: 300;
        text-decoration: line-through;
        
    }

    .price-container button{
        width: 60%;
        height: 50%;
        border: none;
        border-radius: 5px;
        background: linear-gradient(to right, #45e84f, #c7ee35);;
    }
    .label {
        position: absolute;
        top: 15px;
        right: -30px;
        
        padding: 10px;
        border-radius: 999px;
        background-color: #2563eb;
        color: white;
        font-weight: 700;
        z-index: 1;
    }
</style>
